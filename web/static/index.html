<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DeskLink">
<meta name="theme-color" content="#07080c">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>DeskLink</title>
</head>
<body class="booting">

<nav class="rail" id="rail">
  <div class="logo" id="status" title="Connecting"><i></i></div>
  <button class="tab" type="button" data-view="home" aria-label="Home">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
  </button>
  <button class="tab" type="button" data-view="games" aria-label="Games">
    <svg viewBox="0 0 24 24"><path d="M6 11h4M8 9v4"/><path d="M15 12h.01M18 10h.01"/><path d="M17.3 5H6.7a4 4 0 0 0-4 3.6l-.9 8.1A2.5 2.5 0 0 0 4.3 19.5c.9 0 1.7-.5 2.1-1.3L8 15h8l1.6 3.2c.4.8 1.2 1.3 2.1 1.3a2.5 2.5 0 0 0 2.5-2.8l-.9-8.1A4 4 0 0 0 17.3 5z"/></svg>
  </button>
  <button class="tab" type="button" data-view="stats" aria-label="Stats">
    <svg viewBox="0 0 24 24"><path d="M4.5 17a8.5 8.5 0 1 1 15 0"/><path d="M12 13.5 16 8.5"/><circle cx="12" cy="14" r="1.6"/></svg>
  </button>
  <span class="tab-pill" id="tab-pill"></span>
</nav>

<main class="views">
  <div class="conn" id="conn"><i></i><span id="conn-text">Connecting…</span></div>

  <section class="view home" id="view-home"></section>

  <section class="view games" id="view-games">
    <div class="game-list" id="game-list"></div>
    <p class="empty" id="games-empty" hidden data-t="noGames">No games yet. Add them to config.json on your PC.</p>
  </section>

  <section class="view stats" id="view-stats">
    <header class="stats-head">
      <span class="stats-title" data-t="gameMode">GAME MODE</span>
      <span class="gpu-name" id="gpu-name"></span>
    </header>
    <div class="gauges" id="gauges"></div>
    <div class="lower">
      <div class="card chart-card">
        <div class="card-head">
          <span data-t="load60">LOAD · 60s</span>
          <span class="legend"><i class="c-cpu"></i>CPU <i class="c-gpu"></i>GPU</span>
        </div>
        <svg class="chart" viewBox="0 0 300 100" preserveAspectRatio="none">
          <defs>
            <linearGradient id="fill-cpu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".35"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient>
            <linearGradient id="fill-gpu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".35"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
          </defs>
          <path class="grid" d="M0 25H300M0 50H300M0 75H300"/>
          <path id="area-gpu" fill="url(#fill-gpu)"/>
          <path id="area-cpu" fill="url(#fill-cpu)"/>
          <path id="line-gpu" class="line gpu"/>
          <path id="line-cpu" class="line cpu"/>
        </svg>
      </div>
      <div class="card details" id="details">
        <div class="fan-row">
          <svg class="fan" id="fan" viewBox="0 0 40 40"><g><path d="M20 20c0-7 2-12 7-13 3 0 4 3 2 6-2 2-5 4-9 7z"/><path d="M20 20c0-7 2-12 7-13 3 0 4 3 2 6-2 2-5 4-9 7z" transform="rotate(120 20 20)"/><path d="M20 20c0-7 2-12 7-13 3 0 4 3 2 6-2 2-5 4-9 7z" transform="rotate(240 20 20)"/></g><circle cx="20" cy="20" r="3"/></svg>
          <div><b id="fan-val">0</b><small>%</small><span class="sub" id="fan-sub" data-t="gpuFan">GPU FAN</span></div>
          <div class="clock"><b id="clock-val">0</b><small>MHz</small><span class="sub" data-t="coreClock">CORE CLOCK</span></div>
        </div>
        <div class="meter">
          <div class="meter-head"><span>VRAM</span><span id="vram-text">–</span></div>
          <div class="bar"><i id="vram-bar"></i></div>
        </div>
        <div class="meter">
          <div class="meter-head"><span>POWER</span><span id="power-text">–</span></div>
          <div class="bar power"><i id="power-bar"></i></div>
        </div>
      </div>
    </div>
    <p class="no-gpu" id="no-gpu" hidden data-t="noGpu">No NVIDIA GPU found. GPU stats are only available for NVIDIA cards for now.</p>
  </section>

  <section class="view pair" id="view-pair">
    <div class="pair-box">
      <h1 data-t="pairTitle">Pair this device</h1>
      <p data-t="pairHint">Enter the 6-digit PIN shown on your PC.</p>
      <form id="pair-form" autocomplete="off">
        <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••••" aria-label="PIN">
        <button type="submit" data-t="pair">Pair</button>
      </form>
      <p id="pair-error" class="error" role="alert"></p>
    </div>
  </section>
</main>

<div class="rotate" id="rotate">
  <div class="phone"></div>
  <p data-t="rotate">Rotate your phone</p>
</div>

<div class="launch" id="launch" aria-live="polite">
  <div class="launch-bg"></div>
  <div class="launch-art" id="launch-art"></div>
  <div class="launch-info">
    <b id="launch-name"></b>
    <span id="launch-status"></span>
    <div class="launch-bar"><i></i></div>
  </div>
</div>

<div id="toast" class="toast" role="status"></div>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>

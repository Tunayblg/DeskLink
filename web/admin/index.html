<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeskLink</title>
<link rel="icon" href="/icon-32.png" sizes="32x32">
<link rel="icon" href="/icon-180.png" sizes="180x180">
<style nonce="{{NONCE}}">
:root {
  --bg: #0a0b10; --side: #0d0f15; --panel: #12151e; --panel-2: #171b26; --edge: rgba(255,255,255,.07);
  --text: #eef1f7; --muted: #8088a0; --cyan: #38bdf8; --violet: #a78bfa; --green: #34d399; --red: #f43f5e; --amber: #f59e0b;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; display: flex; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }

/* Sidebar */
.side { flex: 0 0 216px; display: flex; flex-direction: column; padding: 22px 14px 16px; background: var(--side); border-right: 1px solid var(--edge); }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 22px; }
.brand img { width: 30px; height: 30px; border-radius: 8px; }
.brand b { font-size: 16px; font-weight: 600; }
.brand small { display: block; font-size: 11px; color: var(--muted); }
.nav button { display: flex; align-items: center; gap: 11px; width: 100%; padding: 9px 10px; margin-bottom: 2px; border: 0; border-radius: 9px; background: none; color: #b8bdcc; text-align: left; }
.nav button:hover { background: rgba(255,255,255,.04); }
.nav button.on { background: rgba(56,189,248,.12); color: #fff; }
.nav svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 18px; }
.nav .count { margin-left: auto; min-width: 20px; padding: 0 6px; border-radius: 10px; background: rgba(52,211,153,.16); color: var(--green); font-size: 11px; text-align: center; }
.side .grow { flex: 1; }
.side .run { display: flex; align-items: center; gap: 8px; padding: 10px 10px 14px; font-size: 12px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(52,211,153,.15); flex: 0 0 8px; }
.dot.off { background: #3a4052; box-shadow: none; }
.dot.bad { background: var(--red); box-shadow: 0 0 0 3px rgba(244,63,94,.15); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border: 1px solid var(--edge); border-radius: 9px; background: rgba(255,255,255,.05); font-size: 13px; }
.btn:hover { background: rgba(255,255,255,.09); }
.btn.primary { border-color: transparent; background: linear-gradient(135deg, #38bdf8, #6366f1); color: #fff; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger:hover { background: rgba(244,63,94,.14); border-color: rgba(244,63,94,.4); color: #fda4af; }
.btn.link { padding: 0; border: 0; background: none; color: var(--cyan); }
.btn.link:hover { text-decoration: underline; }
.btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }

/* Main */
main { flex: 1; min-width: 0; overflow-y: auto; padding: 28px 32px 40px; }
.head { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.head h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.head .btn { margin-left: auto; }
.card { background: var(--panel); border: 1px solid var(--edge); border-radius: 14px; padding: 16px 18px; min-width: 0; }
.metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 14px; }
.label { font-size: 12px; color: var(--muted); }
.value { margin-top: 6px; font-size: 26px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.value small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 3px; }
.hint { margin-top: 3px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
/* CPU and RAM charts: the last two minutes, with the peak marked. */
.charts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 14px; }
.chart-head { display: flex; align-items: baseline; justify-content: space-between; }
.chart-head .big { font-size: 26px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.chart-head .big small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 3px; }
.plot { position: relative; height: 120px; margin: 12px 0 6px 40px; }
.plot svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: visible; }
.plot .grid { fill: none; stroke: rgba(255,255,255,.06); stroke-width: 1; vector-effect: non-scaling-stroke; }
.plot .line { fill: none; stroke: var(--c); stroke-width: 2; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.plot .peakline { fill: none; stroke: var(--c); stroke-width: 1; stroke-dasharray: 3 4; opacity: .7; vector-effect: non-scaling-stroke; }
.ytop, .ybot { position: absolute; left: -40px; width: 34px; text-align: right; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ytop { top: -6px; }
.ybot { bottom: -6px; }
.tag { position: absolute; padding: 1px 7px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--edge); color: var(--c); font-size: 11px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.plot .live { position: absolute; right: 0; width: 8px; height: 8px; margin: -4px -4px 0 0; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 4px rgba(255,255,255,.06); }
.axis { display: flex; justify-content: space-between; margin-left: 40px; font-size: 10px; color: var(--muted); }
.stats3 { display: flex; gap: 20px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.stats3 em { font-style: normal; }
.stats3 b { margin-left: 5px; color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
h2 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
.empty { padding: 26px 0 14px; color: var(--muted); text-align: center; }
.empty .btn { margin-top: 12px; }

/* Lists */
.list { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid transparent; border-radius: 11px; background: var(--panel-2); text-align: left; width: 100%; }
button.row:hover { border-color: var(--edge); }
.row.on { border-color: rgba(56,189,248,.45); background: rgba(56,189,248,.07); }
.row .ico { width: 36px; height: 36px; flex: 0 0 36px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: rgba(255,255,255,.05); overflow: hidden; }
.row .ico svg { width: 18px; height: 18px; fill: none; stroke: #c5cad6; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.row .ico img { width: 100%; height: 100%; object-fit: cover; }
.row .txt { flex: 1; min-width: 0; }
.row .txt b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .txt span { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { display: inline-block; margin-right: 4px; padding: 1px 8px; border-radius: 999px; font-size: 11px; background: rgba(255,255,255,.07); color: #c5cad6; }

/* Devices: list + details */
.split { display: grid; grid-template-columns: minmax(260px, 1fr) 1.15fr; gap: 14px; align-items: start; }
.detail h3 { margin: 0; font-size: 18px; font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; background: rgba(255,255,255,.06); color: var(--muted); }
.pill.live { background: rgba(52,211,153,.12); color: var(--green); }
.facts { margin: 18px 0; border-top: 1px solid var(--edge); }
.facts div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--edge); }
.facts dt, .facts span:first-child { color: var(--muted); }

/* Games */
.row .actions { display: flex; align-items: center; gap: 8px; }
.icon-btn { width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 8px; background: none; color: var(--muted); }
.icon-btn:hover { background: rgba(255,255,255,.07); color: var(--text); }
.icon-btn.danger:hover { background: rgba(244,63,94,.14); color: #fda4af; }
.icon-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Modals */
.scrim { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(3,4,8,.66); }
.modal { width: 440px; max-width: calc(100% - 40px); max-height: calc(100% - 40px); overflow-y: auto; padding: 22px 24px; border: 1px solid var(--edge); border-radius: 16px; background: #141824; box-shadow: 0 30px 80px -20px rgba(0,0,0,.9); }
.modal h2 { font-size: 17px; margin-bottom: 4px; }
.modal .sub { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
.modal .note { margin: 14px 0 0; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(245,158,11,.28); background: rgba(245,158,11,.08); color: #fcd34d; font-size: 12.5px; line-height: 1.45; }
.modal footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
.qr { width: 220px; height: 220px; margin: 4px auto 18px; padding: 0; overflow: hidden; border-radius: 14px; background: #fff; }
.qr svg { display: block; width: 100%; height: 100%; }
.code { text-align: center; font-size: 30px; font-weight: 600; letter-spacing: .16em; font-variant-numeric: tabular-nums; }
.countdown { width: 180px; height: 4px; margin: 8px auto 4px; overflow: hidden; border-radius: 2px; background: rgba(255,255,255,.1); }
.countdown i { display: block; height: 100%; background: var(--cyan); transform-origin: left; transition: transform .25s linear; }
.countdown.low i { background: var(--amber); }
.center { text-align: center; }
.manual { margin-top: 16px; padding: 12px 14px; border-radius: 11px; background: var(--panel-2); font-size: 13px; color: #c5cad6; }
.manual code { display: block; margin-top: 6px; font: 14px Consolas, monospace; color: #fff; user-select: all; }

.field { margin-bottom: 14px; }
.field label { display: block; margin-bottom: 6px; font-size: 12px; color: var(--muted); }
.field input, .field select { width: 100%; padding: 9px 11px; border: 1px solid var(--edge); border-radius: 9px; background: #0e1119; color: var(--text); font: inherit; }
.field input:focus, .field select:focus { outline: none; border-color: rgba(56,189,248,.6); }
.inline { display: flex; gap: 8px; }
.inline input { flex: 1; min-width: 0; }
.seg { display: flex; padding: 3px; margin-bottom: 16px; border-radius: 10px; background: #0e1119; border: 1px solid var(--edge); }
.seg button { flex: 1; padding: 6px; border: 0; border-radius: 7px; background: none; color: var(--muted); }
.seg button.on { background: rgba(255,255,255,.08); color: var(--text); }
.form-error { min-height: 18px; margin-top: 6px; color: #fda4af; font-size: 13px; }
details summary { cursor: pointer; color: var(--muted); font-size: 12px; margin-bottom: 10px; }

.head.second { margin: 28px 0 14px; }
.head.second h2 { margin: 0; font-size: 17px; font-weight: 600; }
.head.second p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.row .ico { font-size: 15px; }
.row .ico.has-brand { background: none; }
.row .ico svg.svc-icon { width: 100%; height: 100%; fill: initial; stroke: none; }
button.row { cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.chipbtn { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border: 1px solid var(--edge); border-radius: 999px; background: rgba(255,255,255,.04); font-size: 13px; }
.chipbtn:hover { background: rgba(255,255,255,.09); }
.chipbtn i { width: 9px; height: 9px; border-radius: 50%; }
.modal footer .grow { flex: 1; }
.toast { position: fixed; bottom: 20px; left: 50%; z-index: 20; padding: 9px 16px; border-radius: 10px; background: #23283a; border: 1px solid var(--edge); font-size: 13px; transform: translate(-50%, 20px); opacity: 0; transition: opacity .25s, transform .3s; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.offline { margin-bottom: 14px; padding: 10px 14px; border-radius: 10px; background: rgba(244,63,94,.1); color: #fda4af; }
@media (max-width: 900px) { .metrics { grid-template-columns: repeat(2, 1fr); } .charts { grid-template-columns: 1fr; } .split { grid-template-columns: 1fr; } }
/*{{GUIDE_CSS}}*/
</style>
</head>
<body>
<aside class="side">
  <div class="brand"><img src="/icon-180.png" alt=""><div><b>DeskLink</b><small id="version"></small></div></div>
  <nav class="nav">
    <button data-view="overview" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span data-t="overview"></span></button>
    <button data-view="devices"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg><span data-t="devices"></span><span class="count" id="nav-online" hidden></span></button>
    <button data-view="games"><svg viewBox="0 0 24 24"><path d="M6 11h4M8 9v4"/><path d="M15 12h.01M18 10h.01"/><path d="M17.3 5H6.7a4 4 0 0 0-4 3.6l-.9 8.1A2.5 2.5 0 0 0 4.3 19.5c.9 0 1.7-.5 2.1-1.3L8 15h8l1.6 3.2c.4.8 1.2 1.3 2.1 1.3a2.5 2.5 0 0 0 2.5-2.8l-.9-8.1A4 4 0 0 0 17.3 5z"/></svg><span data-t="games"></span></button>
    <button data-view="guide"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M9 8h6"/></svg><span data-t="guide"></span></button>
  </nav>
  <div class="grow"></div>
  <div class="run"><span class="dot" id="dot"></span><span id="uptime"></span></div>
  <button class="btn primary" id="add-device"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-t="addDevice"></span></button>
</aside>

<main>
  <div class="offline" id="offline" hidden data-t="offline"></div>

  <section id="v-overview">
    <div class="head"><div><h1 data-t="overview"></h1><p data-t="overviewSub"></p></div></div>
    <div class="charts">
      <div class="card chart" style="--c:#38bdf8">
        <div class="chart-head"><span class="label" data-t="memChart"></span><span class="big"><b id="c-mem-now">–</b><small id="c-mem-unit"></small></span></div>
        <div class="plot">
          <span class="ytop" id="c-mem-top"></span><span class="ybot">0</span>
          <svg viewBox="0 0 300 100" preserveAspectRatio="none">
            <defs><linearGradient id="g-mem" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".32"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient></defs>
            <path class="grid" d="M0 25H300M0 50H300M0 75H300"/>
            <path id="c-mem-area" fill="url(#g-mem)"/>
            <path id="c-mem-peakline" class="peakline"/>
            <path id="c-mem-line" class="line"/>
          </svg>
          <span class="tag" id="c-mem-tag" hidden></span>
          <i class="live" id="c-mem-live" hidden></i>
        </div>
        <div class="axis"><span data-t="twoMin"></span><span data-t="nowL"></span></div>
        <div class="hint" id="c-mem-hint">&nbsp;</div>
        <div class="stats3"><span><em id="c-mem-l1"></em><b id="c-mem-s1">–</b></span><span><em id="c-mem-l2"></em><b id="c-mem-s2">–</b></span><span><em id="c-mem-l3"></em><b id="c-mem-s3">–</b></span></div>
      </div>
      <div class="card chart" style="--c:#a78bfa">
        <div class="chart-head"><span class="label" data-t="cpuChart"></span><span class="big"><b id="c-cpu-now">–</b><small id="c-cpu-unit"></small></span></div>
        <div class="plot">
          <span class="ytop" id="c-cpu-top"></span><span class="ybot">0</span>
          <svg viewBox="0 0 300 100" preserveAspectRatio="none">
            <defs><linearGradient id="g-cpu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".32"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient></defs>
            <path class="grid" d="M0 25H300M0 50H300M0 75H300"/>
            <path id="c-cpu-area" fill="url(#g-cpu)"/>
            <path id="c-cpu-peakline" class="peakline"/>
            <path id="c-cpu-line" class="line"/>
          </svg>
          <span class="tag" id="c-cpu-tag" hidden></span>
          <i class="live" id="c-cpu-live" hidden></i>
        </div>
        <div class="axis"><span data-t="twoMin"></span><span data-t="nowL"></span></div>
        <div class="stats3"><span><em id="c-cpu-l1"></em><b id="c-cpu-s1">–</b></span><span><em id="c-cpu-l2"></em><b id="c-cpu-s2">–</b></span><span><em id="c-cpu-l3"></em><b id="c-cpu-s3">–</b></span></div>
      </div>
    </div>
    <div class="metrics">
      <div class="card"><div class="label" data-t="connectedNow"></div><div class="value" id="m-online">–</div><div class="hint" id="m-online-hint">&nbsp;</div></div>
      <div class="card"><div class="label" data-t="paired"></div><div class="value" id="m-paired">–</div><div class="hint" data-t="pairedHint"></div></div>
    </div>
    <div class="card">
      <h2 data-t="connectedNow"></h2>
      <div class="list" id="ov-online"></div>
      <div class="empty" id="ov-empty" hidden><span data-t="noneConnected"></span></div>
    </div>
  </section>

  <section id="v-devices" hidden>
    <div class="head"><div><h1 data-t="devices"></h1><p data-t="devicesSub"></p></div>
      <button class="btn" id="add-device-2"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-t="addDevice"></span></button></div>
    <div class="split" id="dev-split">
      <div class="card"><div class="list" id="dev-list"></div></div>
      <div class="card detail" id="dev-detail"></div>
    </div>
    <div class="card empty" id="dev-empty" hidden><div data-t="noDevices"></div>
      <button class="btn primary" id="add-device-3"><span data-t="addDevice"></span></button></div>
  </section>

  <section id="v-games" hidden>
    <div class="head"><div><h1 data-t="games"></h1><p data-t="gamesSub"></p></div>
      <button class="btn primary" id="add-game"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-t="addGame"></span></button></div>
    <div class="card">
      <div class="list" id="game-list"></div>
      <div class="empty" id="game-empty" hidden><span data-t="noGames"></span></div>
    </div>
    <div class="head second"><div><h2 data-t="shortcuts"></h2><p data-t="shortcutsSub"></p></div></div>
    <div class="card"><div class="list" id="sc-list"></div></div>
  </section>

  <section id="v-guide" hidden>
    <div class="head"><div><h1 data-t="guide"></h1><p data-t="guideSub"></p></div></div>
    <div id="guide-root"></div>
  </section>
</main>

<!-- Add device -->
<div class="scrim" id="pair-modal" hidden>
  <div class="modal">
    <h2 data-t="addDevice"></h2>
    <p class="sub" data-t="pairSub"></p>
    <div class="qr" id="qr"></div>
    <div class="code" id="code">––– –––</div>
    <div class="countdown" id="countdown-bar"><i id="countdown"></i></div>
    <div class="hint center" id="code-left">&nbsp;</div>
    <div class="center"><button class="btn link" id="rotate" data-t="newCode"></button></div>
    <div class="center" id="manual-open-wrap"><button class="btn" id="manual-open" data-t="manualOpen"></button></div>
    <div class="manual" id="manual" hidden><span data-t="manualText"></span><code id="manual-addr"></code></div>
    <footer><button class="btn" data-close="pair-modal" data-t="done"></button></footer>
  </div>
</div>

<!-- Add or edit a game -->
<div class="scrim" id="game-modal" hidden>
  <div class="modal">
    <h2 id="game-modal-title"></h2>
    <p class="sub" data-t="gameSub"></p>
    <div class="field"><label for="g-name" data-t="name"></label><input id="g-name" maxlength="40" autocomplete="off"></div>
    <div class="seg" id="g-kind"><button data-kind="program" class="on" data-t="program"></button><button data-kind="steam" data-t="steam"></button></div>
    <div id="g-program">
      <p class="note" data-t="launcherNote"></p>
      <div class="field"><label for="g-target" data-t="programPath"></label>
        <div class="inline"><input id="g-target" spellcheck="false" placeholder="D:\Games\Game\Game.exe"><button class="btn" id="g-browse" data-t="browse"></button></div></div>
      <details><summary data-t="advanced"></summary>
        <div class="field"><label for="g-args" data-t="arguments"></label><input id="g-args" spellcheck="false"></div>
        <div class="field"><label for="g-iconfrom" data-t="iconFrom"></label><input id="g-iconfrom" spellcheck="false"></div>
      </details>
    </div>
    <div id="g-steam" hidden>
      <div class="field"><label for="g-steamlist" data-t="steamGame"></label><select id="g-steamlist"></select></div>
    </div>
    <div class="form-error" id="g-error"></div>
    <footer><button class="btn" data-close="game-modal" data-t="cancel"></button><button class="btn primary" id="g-save" data-t="save"></button></footer>
  </div>
</div>

<!-- Edit a shortcut slot -->
<div class="scrim" id="sc-modal" hidden>
  <div class="modal">
    <h2 id="sc-modal-title"></h2>
    <p class="sub" data-t="scSub"></p>
    <div class="seg" id="sc-kind"><button data-kind="game" data-t="scGame"></button><button data-kind="other" class="on" data-t="scOther"></button></div>
    <div id="sc-game-part" hidden>
      <div class="field"><label for="sc-game" data-t="scPickGame"></label><select id="sc-game"></select></div>
    </div>
    <div id="sc-other-part">
      <div class="chips" id="sc-presets"></div>
      <div class="field"><label for="sc-name" data-t="name"></label><input id="sc-name" maxlength="40" autocomplete="off"></div>
      <div class="field"><label for="sc-target" data-t="scTarget"></label>
        <div class="inline"><input id="sc-target" spellcheck="false" placeholder="netflix.com"><button class="btn" id="sc-browse" data-t="browse"></button></div></div>
    </div>
    <div class="form-error" id="sc-error"></div>
    <footer><button class="btn danger" id="sc-clear" data-t="scClear"></button><span class="grow"></span><button class="btn" data-close="sc-modal" data-t="cancel"></button><button class="btn primary" id="sc-save" data-t="save"></button></footer>
  </div>
</div>

<div class="toast" id="toast"></div>

<script nonce="{{NONCE}}">/*{{BRANDS_JS}}*/
/*{{GUIDE_JS}}*/</script>
<script nonce="{{NONCE}}">
(function () {
  "use strict";
  var TOKEN = "{{ADMIN_TOKEN}}";
  var $ = function (id) { return document.getElementById(id); };

  var STR = {
    en: {

      scTitle: "Tile {}", scSub: "Pick a game, a service, or paste any web address or program.", scTarget: "Web address or program", scClear: "Clear tile", needAddress: "Enter an address or choose a program.", scNeedName: "Give the shortcut a name.",
      overview: "Overview", devices: "Devices", games: "Games", addDevice: "Add device", addGame: "Add game",

      twoMin: "5 min ago", nowL: "now", nowS: "Now", peakS: "Peak", avgS: "Average", wsS: "Working set", memChart: "DeskLink memory", cpuChart: "DeskLink CPU", ramShare: "{}% of this PC's RAM", startPeak: "peak since start {} MB",
      paired: "Paired devices", pairedHint: "Phones and tablets that can connect", noneConnected: "No device is connected right now.",

      iconFrom: "Take the icon from another .exe (optional)", steamGame: "Installed Steam game",
      cancel: "Cancel", save: "Save", editGame: "Edit game", newGame: "Add game", saved: "Saved. Phones are updated.",
      removed: "Removed.", connected: "Connected", notConnected: "Not connected", buttonsOnly: "Buttons",
      statusL: "Status", addressL: "Address", forL: "Connected for", showingL: "Showing", pairedL: "Paired on",
      remove: "Remove", removeQ: "Remove {}? It will have to be paired again.", deleteQ: "Remove {} from your games?",
      newCodeIn: "New code in {} s", noSteam: "No Steam games found",
      running: "Running for {}", stream_media: "Now playing", stream_stats: "Stats", streaming: "{} showing live data", idle: "Idle",

    },
    tr: {
      guide: "Kılavuz", guideSub: "Telefonunu bağlamak için adım adım yardım.",
      shortcuts: "Ana ekran", shortcutsSub: "Telefonun ana ekranındaki altı kutu. Her biri bir oyun, web sitesi ya da program açar.", emptySlot: "Boş kutu {}", emptySlotHint: "Oyun, web sitesi veya program eklemek için dokun", scGame: "Oyun", scOther: "Web sitesi veya program", scPickGame: "Oyunun", scGameKind: "Oyun", noGamesYet: "Önce bu sayfadan bir oyun ekle.",
      scTitle: "Kutu {}", scSub: "Bir oyun, bir servis seç ya da herhangi bir web adresi veya program gir.", scTarget: "Web adresi veya program", scClear: "Kutuyu boşalt", needAddress: "Bir adres gir ya da program seç.", scNeedName: "Kısayola bir ad ver.",
      overview: "Genel bakış", devices: "Cihazlar", games: "Oyunlar", addDevice: "Cihaz ekle", addGame: "Oyun ekle",
      overviewSub: "DeskLink arka planda çalışıyor.", memory: "DeskLink belleği", connectedNow: "Şu an bağlı",
      twoMin: "5 dk önce", nowL: "şimdi", nowS: "Şimdi", peakS: "En yüksek", avgS: "Ortalama", wsS: "Çalışma kümesi", memChart: "DeskLink belleği", cpuChart: "DeskLink işlemci", ramShare: "bu bilgisayarın RAM'inin %{}'i", startPeak: "açılıştan beri en yüksek {} MB",
      paired: "Eşleşmiş cihazlar", pairedHint: "Bağlanabilen telefon ve tabletler", noneConnected: "Şu an bağlı cihaz yok.",
      devicesSub: "Bu bilgisayarla eşleşmiş her şey.", noDevices: "Henüz cihaz yok.",
      gamesSub: "Telefondan başlatabileceğin oyunlar. Değişiklikler bağlı telefonlarda anında görünür.", noGames: "Henüz oyun yok.",
      pairSub: "Telefonun kamerasıyla okut.", newCode: "Yeni kod", manualOpen: "Okutamıyor musun? Elle bağlan",
      manualText: "Telefonda (aynı Wi-Fi) bu adresi aç ve yukarıdaki kodu gir:", done: "Tamam",
      offline: "DeskLink yanıt vermiyor. Hâlâ çalışıyor mu?",
      launcherNote: "Riot (Valorant, LoL) ve EA oyunlarında sorun yaşanabilir: kendi başlatıcıları veya anti-cheat sistemleri başka bir programın oyunu açmasını çoğu zaman engeller. En stabil sonuç için oyunlarını Steam'den ekle.",
      gameSub: "Bir program ya da Steam oyunlarından birini seç.", name: "Ad", program: "Program", steam: "Steam",
      programPath: "Program", browse: "Gözat…", advanced: "Gelişmiş", arguments: "Başlatma seçenekleri (isteğe bağlı)",
      iconFrom: "İkonu başka bir .exe'den al (isteğe bağlı)", steamGame: "Yüklü Steam oyunu",
      cancel: "Vazgeç", save: "Kaydet", editGame: "Oyunu düzenle", newGame: "Oyun ekle", saved: "Kaydedildi. Telefonlar güncellendi.",
      removed: "Kaldırıldı.", connected: "Bağlı", notConnected: "Bağlı değil", buttonsOnly: "Butonlar",
      statusL: "Durum", addressL: "Adres", forL: "Bağlantı süresi", showingL: "Açık ekran", pairedL: "Eşleşme tarihi",
      remove: "Kaldır", removeQ: "{} kaldırılsın mı? Tekrar eşleşmesi gerekecek.", deleteQ: "{} oyunlardan kaldırılsın mı?",
      newCodeIn: "{} sn sonra yeni kod", noSteam: "Steam oyunu bulunamadı",
      running: "{} süredir çalışıyor", stream_media: "Şimdi çalıyor", stream_stats: "İstatistik", streaming: "{} cihaz canlı veri gösteriyor", idle: "Boşta",
      needName: "Oyuna bir ad ver.", needProgram: "Bir program seç."
    }
  };
  var LANG = /^tr\b/i.test(navigator.language || "") ? "tr" : "en";
  document.documentElement.lang = LANG;
  function t(k, a) { var s = STR[LANG][k] || STR.en[k] || k; return a === undefined ? s : s.replace("{}", a); }
  Array.prototype.forEach.call(document.querySelectorAll("[data-t]"), function (el) { el.textContent = t(el.dataset.t); });

  var ICON_PHONE = '<svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg>';
  var ICON_TABLET = '<svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2.5"/><path d="M11 18h2"/></svg>';
  var ICON_GAME = '<svg viewBox="0 0 24 24"><path d="M6 11h4M8 9v4"/><path d="M15 12h.01M18 10h.01"/><path d="M17.3 5H6.7a4 4 0 0 0-4 3.6l-.9 8.1A2.5 2.5 0 0 0 4.3 19.5c.9 0 1.7-.5 2.1-1.3L8 15h8l1.6 3.2c.4.8 1.2 1.3 2.1 1.3a2.5 2.5 0 0 0 2.5-2.8l-.9-8.1A4 4 0 0 0 17.3 5z"/></svg>';
  var ICON_EDIT = '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>';
  var ICON_TRASH = '<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';

  function api(path, body) {
    return fetch("/admin/api/" + path, {
      method: body ? "POST" : "GET",
      headers: { "X-Admin-Token": TOKEN, "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error(j.error || String(r.status));
        return j;
      });
    });
  }

  var toastTimer;
  function toast(msg) {
    var el = $("toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2200);
  }

  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; return e; }
  function text(tag, cls, s) { var e = el(tag, cls); e.textContent = s; return e; }

  function duration(s) {
    if (s < 60) return s + "s";
    var m = Math.floor(s / 60), h = Math.floor(m / 60), d = Math.floor(h / 24);
    if (d) return d + "d " + (h % 24) + "h";
    if (h) return h + "h " + (m % 60) + "m";
    return m + "m";
  }
  function dateText(iso) { return new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }); }

  // ---- Navigation --------------------------------------------------------

  var current = "overview";
  var navButtons = document.querySelectorAll(".nav button");
  function go(view) {
    if (view === "guide") { openGuide(); return; }
    closeGuide();
    current = view;
    Array.prototype.forEach.call(navButtons, function (b) { b.classList.toggle("on", b.dataset.view === view); });
    ["overview", "devices", "games"].forEach(function (v) { $("v-" + v).hidden = v !== view; });
    if (view === "games") { loadGames(); loadShortcuts(); }
    if (view === "overview") pollUsage();
    if (last) render(last);
  }

  // The guide opens in the middle of the window over a blurred dashboard. The
  // window itself is enlarged while it is open, as with the middle button of its
  // title bar (the PC does that, a web page cannot), and put back on closing.
  var guideMaximized = false; // true when the guide is what enlarged the window
  function openGuide() {
    if (!$("v-guide").hidden) return;
    $("v-guide").hidden = false;
    Array.prototype.forEach.call(navButtons, function (b) { b.classList.toggle("on", b.dataset.view === "guide"); });
    api("window", { maximize: true }).then(function (r) {
      if (!r.changed) return;
      // The guide may have been closed before the answer came.
      if ($("v-guide").hidden) api("window", { maximize: false }).catch(function () {});
      else guideMaximized = true;
    }, function () {});
    if (window.DeskGuide) window.DeskGuide.show();
  }
  function closeGuide() {
    if ($("v-guide").hidden) return;
    $("v-guide").hidden = true;
    Array.prototype.forEach.call(navButtons, function (b) { b.classList.toggle("on", b.dataset.view === current); });
    if (guideMaximized) {
      guideMaximized = false;
      api("window", { maximize: false }).catch(function () {});
    }
  }
  // A click on the blurred dashboard around the guide closes it.
  $("v-guide").addEventListener("click", function (ev) { if (ev.target === $("v-guide")) closeGuide(); });
  Array.prototype.forEach.call(navButtons, function (b) { b.onclick = function () { go(b.dataset.view); }; });
  document.addEventListener("deskguide:exit", closeGuide);

  // ---- Status ------------------------------------------------------------

  var last = null, selected = null;

  // ---- DeskLink's own memory and CPU ---------------------------------------
  //
  // Sampled once a second while the overview is showing (nothing is read on
  // the PC otherwise) and kept for five minutes, so a slow memory leak would
  // show as a climbing line. The x axis is real time: a gap while the window
  // was hidden shows as a gap. The scale follows DeskLink's own numbers.

  var WINDOW_MS = 300000;
  var use = { mem: [], cpu: [] };   // [{ t, raw }]
  var fmtUse = {
    mem: function (v) { return v.toFixed(1) + " MB"; },
    cpu: function (v) { return v.toFixed(1) + "%"; }
  };
  var niceTop = {
    mem: function (peak) { return Math.max(16, Math.ceil(peak * 1.3 / 8) * 8); },
    cpu: function (peak) { return Math.max(5, Math.ceil(peak * 1.3)); }
  };

  function applyUsage(u) {
    var p = u.process, now = Date.now();
    [["mem", p.private_mb], ["cpu", p.cpu]].forEach(function (s) {
      var h = use[s[0]];
      h.push({ t: now, raw: s[1] });
      while (h.length && now - h[0].t > WINDOW_MS) h.shift();
    });
    $("c-mem-now").textContent = p.private_mb.toFixed(1);
    $("c-mem-unit").textContent = "MB";
    $("c-cpu-now").textContent = p.cpu.toFixed(1);
    $("c-cpu-unit").textContent = "%";
    var total = u.ram_total_mb;
    $("c-mem-hint").textContent = (total ? t("ramShare", (p.private_mb / total * 100).toFixed(2)) + " · " : "") +
      "Go heap " + p.heap_mb.toFixed(1) + " MB · " + t("startPeak", p.peak_working_set_mb.toFixed(0));
    drawChart("mem", [t("nowS"), t("peakS"), t("wsS")], function () {
      return [fmtUse.mem(p.private_mb), null, fmtUse.mem(p.working_set_mb)];
    });
    drawChart("cpu", [t("nowS"), t("peakS"), t("avgS")], function (avg) {
      return [fmtUse.cpu(p.cpu), null, fmtUse.cpu(avg)];
    });
  }

  function drawChart(key, labels, texts) {
    var h = use[key];
    if (!h.length) return;
    var now = Date.now();
    var peak = h[0], sum = 0;
    h.forEach(function (p) { if (p.raw >= peak.raw) peak = p; sum += p.raw; });
    var top = niceTop[key](peak.raw);
    var x = function (p) { return Math.max(0, (p.t - (now - WINDOW_MS)) / WINDOW_MS * 300); };
    var y = function (v) { return 98 - v / top * 94; };
    var pts = h.map(function (p) { return x(p).toFixed(1) + " " + y(p.raw).toFixed(1); });
    if (pts.length === 1) pts.push((x(h[0]) + 0.1).toFixed(1) + " " + y(h[0].raw).toFixed(1));
    $("c-" + key + "-line").setAttribute("d", "M" + pts.join("L"));
    $("c-" + key + "-area").setAttribute("d", "M" + x(h[0]).toFixed(1) + " 100L" + pts.join("L") + "L" + x(h[h.length - 1]).toFixed(1) + " 100Z");
    $("c-" + key + "-top").textContent = key === "mem" ? top + " MB" : top + "%";

    // The dashed line and a tag at the peak: above the line, or below it near
    // the top, on the side with room.
    var tag = $("c-" + key + "-tag"), line = $("c-" + key + "-peakline");
    var show = h.length > 2 && peak.raw > 0;
    tag.hidden = !show;
    line.setAttribute("d", show ? "M0 " + y(peak.raw).toFixed(1) + "L300 " + y(peak.raw).toFixed(1) : "");
    if (show) {
      var py = y(peak.raw), px = x(peak) / 300 * 100;
      tag.textContent = fmtUse[key](peak.raw);
      tag.style.top = py + "%";
      tag.style.left = px + "%";
      tag.style.transform = "translate(" + (px > 60 ? "-100%" : "0") + "," + (py < 22 ? "4px" : "calc(-100% - 4px)") + ")";
    }
    var live = $("c-" + key + "-live");
    live.hidden = false;
    live.style.top = y(h[h.length - 1].raw) + "%";

    var vals = texts(sum / h.length);
    vals[1] = fmtUse[key](peak.raw);
    for (var i = 0; i < 3; i++) {
      $("c-" + key + "-l" + (i + 1)).textContent = labels[i];
      $("c-" + key + "-s" + (i + 1)).textContent = vals[i];
    }
  }

  function pollUsage() {
    if (document.hidden || current !== "overview") return;
    api("usage").then(applyUsage).catch(function () {});
  }

  function sessionsByDevice(st) {
    var m = {};
    st.sessions.forEach(function (s) { (m[s.device_id] = m[s.device_id] || []).push(s); });
    return m;
  }

  function deviceIcon(name) { return /iPad|Tablet/i.test(name) ? ICON_TABLET : ICON_PHONE; }

  function render(st) {
    last = st;
    $("offline").hidden = true;
    $("dot").className = "dot";
    $("version").textContent = "v" + st.version;
    $("uptime").textContent = t("running", duration(st.uptime_s));

    var online = sessionsByDevice(st);
    var onlineCount = Object.keys(online).length;
    $("m-online").textContent = onlineCount;
    var live = st.sessions.filter(function (s) { return s.streams.length; }).length;
    $("m-online-hint").textContent = live ? t("streaming", live) : t("idle");
    $("m-paired").textContent = st.devices.length;
    $("nav-online").hidden = !onlineCount;
    $("nav-online").textContent = onlineCount;

    renderOverview(st, online);
    renderDevices(st, online);
    updatePair(st);
  }

  function sessionText(s) {
    var showing = s.streams.map(function (k) { return t("stream_" + k); });
    return (showing.length ? showing.join(" · ") : t("buttonsOnly")) + " · " + duration(s.since_s);
  }

  function renderOverview(st, online) {
    var list = $("ov-online"); list.innerHTML = "";
    st.devices.filter(function (d) { return online[d.id]; }).forEach(function (d) {
      var r = el("button", "row");
      r.appendChild(el("span", "ico", deviceIcon(d.name)));
      var tx = el("span", "txt"); tx.appendChild(text("b", "", d.name)); tx.appendChild(text("span", "", sessionText(online[d.id][0]))); r.appendChild(tx);
      r.appendChild(el("span", "dot"));
      r.onclick = function () { selected = d.id; go("devices"); };
      list.appendChild(r);
    });
    $("ov-empty").hidden = list.children.length > 0;
  }

  function renderDevices(st, online) {
    var has = st.devices.length > 0;
    $("dev-split").hidden = !has; $("dev-empty").hidden = has;
    if (!has) return;
    var devs = st.devices.slice().sort(function (a, b) { return (online[b.id] ? 1 : 0) - (online[a.id] ? 1 : 0); });
    if (!selected || !devs.some(function (d) { return d.id === selected; })) selected = devs[0].id;

    var list = $("dev-list"); list.innerHTML = "";
    devs.forEach(function (d) {
      var r = el("button", "row" + (d.id === selected ? " on" : ""));
      r.appendChild(el("span", "ico", deviceIcon(d.name)));
      var tx = el("span", "txt"); tx.appendChild(text("b", "", d.name));
      tx.appendChild(text("span", "", online[d.id] ? t("connected") + " · " + duration(online[d.id][0].since_s) : dateText(d.paired_at)));
      r.appendChild(tx);
      r.appendChild(el("span", "dot" + (online[d.id] ? "" : " off")));
      r.onclick = function () { selected = d.id; render(last); };
      list.appendChild(r);
    });

    var d = devs.filter(function (x) { return x.id === selected; })[0];
    var s = online[d.id] && online[d.id][0];
    var box = $("dev-detail"); box.innerHTML = "";
    box.appendChild(text("h3", "", d.name));
    box.appendChild(text("span", "pill" + (s ? " live" : ""), s ? t("connected") : t("notConnected")));
    var facts = el("dl", "facts");
    function fact(k, v) { var row = el("div"); row.appendChild(text("span", "", k)); if (typeof v === "string") row.appendChild(text("span", "", v)); else row.appendChild(v); facts.appendChild(row); }
    if (s) {
      fact(t("addressL"), s.addr.replace(/:\d+$/, ""));
      fact(t("forL"), duration(s.since_s));
      var badges = el("span");
      if (!s.streams.length) badges.textContent = t("buttonsOnly");
      s.streams.forEach(function (k) { badges.appendChild(text("span", "badge", t("stream_" + k))); });
      fact(t("showingL"), badges);
    }
    fact(t("pairedL"), dateText(d.paired_at));
    box.appendChild(facts);
    var rm = text("button", "btn danger", t("remove"));
    rm.onclick = function () {
      if (!confirm(t("removeQ", d.name))) return;
      api("revoke", { id: d.id }).then(function () { toast(t("removed")); selected = null; refresh(); });
    };
    box.appendChild(rm);
  }

  function refresh() {
    return api("status").then(render).catch(function (e) {
      // 403: DeskLink was restarted and has a new dashboard token, so this
      // page's token is stale. Reload to pick up the new one.
      if (e.message === "403") { location.reload(); return; }
      $("offline").hidden = false;
      $("dot").className = "dot bad";
    });
  }

  // ---- Add device --------------------------------------------------------

  var codeExpires = 0, lastQR = null;
  function updatePair(st) {
    $("code").textContent = st.code.slice(0, 3) + " " + st.code.slice(3);
    codeExpires = Date.now() + st.code_left_s * 1000;
    if (st.qr !== lastQR) { $("qr").innerHTML = st.qr; lastQR = st.qr; } // our own SVG from the server
    $("manual-addr").textContent = st.addresses[0] || "";
  }
  setInterval(function () {
    if (!codeExpires || $("pair-modal").hidden) return;
    var left = Math.max(0, (codeExpires - Date.now()) / 1000);
    $("countdown").style.transform = "scaleX(" + (left / 30).toFixed(3) + ")";
    $("countdown-bar").classList.toggle("low", left < 6);
    $("code-left").textContent = t("newCodeIn", Math.ceil(left));
    if (left === 0) { codeExpires = 0; refresh(); }
  }, 250);

  function openPair() {
    $("manual").hidden = true; $("manual-open-wrap").hidden = false;
    $("pair-modal").hidden = false;
    refresh();
  }
  $("add-device").onclick = $("add-device-2").onclick = $("add-device-3").onclick = openPair;
  $("rotate").onclick = function () { api("rotate", {}).then(refresh); };
  $("manual-open").onclick = function () { $("manual").hidden = false; $("manual-open-wrap").hidden = true; };

  Array.prototype.forEach.call(document.querySelectorAll("[data-close]"), function (b) {
    b.onclick = function () { $(b.dataset.close).hidden = true; };
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { $("pair-modal").hidden = true; $("game-modal").hidden = true; }
  });

  // ---- Games -------------------------------------------------------------

  var games = [];

  function loadGames() {
    return api("games").then(function (r) { games = r.games; renderGames(); });
  }

  function gameSub(g) {
    if (g.steam_appid) return "Steam · " + g.steam_appid;
    return g.target + (g.args ? "  " + g.args : "");
  }

  function renderGames() {
    var list = $("game-list"); list.innerHTML = "";
    games.forEach(function (g, i) {
      var r = el("div", "row");
      var ico = el("span", "ico");
      if (g.icon) { var img = document.createElement("img"); img.src = g.icon; img.alt = ""; ico.appendChild(img); } else ico.innerHTML = ICON_GAME;
      r.appendChild(ico);
      var tx = el("span", "txt"); tx.appendChild(text("b", "", g.name)); tx.appendChild(text("span", "", gameSub(g))); r.appendChild(tx);
      var acts = el("span", "actions");
      var ed = el("button", "icon-btn", ICON_EDIT); ed.title = t("editGame"); ed.onclick = function () { openGame(i); };
      var del = el("button", "icon-btn danger", ICON_TRASH); del.title = t("remove");
      del.onclick = function () {
        if (!confirm(t("deleteQ", g.name))) return;
        saveGames(games.filter(function (_, j) { return j !== i; })).catch(function (e) { toast(e.message); });
      };
      acts.appendChild(ed); acts.appendChild(del);
      r.appendChild(acts);
      list.appendChild(r);
    });
    $("game-empty").hidden = games.length > 0;
  }

  function saveGames(list) {
    var body = { games: list.map(function (g) { var c = Object.assign({}, g); delete c.icon; return c; }) };
    return api("games", body).then(function (r) {
      games = r.games; renderGames(); toast(t("saved"));
      loadShortcuts();
    });
  }

  // Editor
  var editing = -1, kind = "program", steamGames = null;

  function setKind(k) {
    kind = k;
    Array.prototype.forEach.call($("g-kind").children, function (b) { b.classList.toggle("on", b.dataset.kind === k); });
    $("g-program").hidden = k !== "program"; $("g-steam").hidden = k !== "steam";
    if (k === "steam") loadSteam();
  }
  Array.prototype.forEach.call($("g-kind").children, function (b) { b.onclick = function () { setKind(b.dataset.kind); }; });

  function loadSteam(selectId) {
    var sel = $("g-steamlist");
    function fill() {
      sel.innerHTML = "";
      if (!steamGames.length) { var o = document.createElement("option"); o.textContent = t("noSteam"); o.value = ""; sel.appendChild(o); return; }
      steamGames.forEach(function (s) { var o = document.createElement("option"); o.value = s.appid; o.textContent = s.name; sel.appendChild(o); });
      if (selectId) sel.value = selectId;
    }
    if (steamGames) { fill(); return; }
    api("steam").then(function (r) { steamGames = r.games || []; fill(); });
  }
  $("g-steamlist").onchange = function () {
    var opt = $("g-steamlist").selectedOptions[0];
    if (opt && opt.value && !$("g-name").value.trim()) $("g-name").value = opt.textContent;
  };

  function openGame(i) {
    editing = i;
    var g = i >= 0 ? games[i] : { name: "", target: "", args: "", icon_from: "" };
    $("game-modal-title").textContent = i >= 0 ? t("editGame") : t("newGame");
    $("g-name").value = g.name || "";
    $("g-target").value = g.target || "";
    $("g-args").value = g.args || "";
    $("g-iconfrom").value = g.icon_from || "";
    $("g-error").textContent = "";
    setKind(g.steam_appid ? "steam" : "program");
    if (g.steam_appid) loadSteam(String(g.steam_appid));
    $("game-modal").hidden = false;
    setTimeout(function () { $("g-name").focus(); }, 30);
  }
  $("add-game").onclick = function () { openGame(-1); };

  // Opens the Windows file picker on this PC.
  $("g-browse").onclick = function () {
    api("browse", {}).then(function (r) {
      if (!r.path) return;
      $("g-target").value = r.path;
      if (!$("g-name").value.trim()) {
        $("g-name").value = r.path.split("\\").pop().replace(/\.(exe|lnk|bat|cmd)$/i, "");
      }
    });
  };

  $("g-save").onclick = function () {
    var name = $("g-name").value.trim();
    if (!name) { $("g-error").textContent = t("needName"); return; }
    var g = editing >= 0 ? Object.assign({}, games[editing]) : {};
    g.name = name;
    if (kind === "steam") {
      var id = parseInt($("g-steamlist").value, 10);
      if (!id) { $("g-error").textContent = t("noSteam"); return; }
      g.steam_appid = id; g.target = ""; g.args = "";
    } else {
      var target = $("g-target").value.trim();
      if (!target) { $("g-error").textContent = t("needProgram"); return; }
      g.steam_appid = 0; g.target = target; g.args = $("g-args").value.trim(); g.icon_from = $("g-iconfrom").value.trim();
    }
    var list = games.slice();
    if (editing >= 0) list[editing] = g; else list.push(g);
    saveGames(list).then(function () { $("game-modal").hidden = true; }).catch(function (e) { $("g-error").textContent = e.message; });
  };

  // ---- Shortcuts: the three tiles under the games on the phone's home screen ----

  var PRESETS = [
    { name: "Netflix", url: "https://www.netflix.com", tint: "229,9,20" },
    { name: "YouTube", url: "https://www.youtube.com", tint: "255,40,40" },
    { name: "Twitch", url: "https://www.twitch.tv", tint: "145,70,255" },
    { name: "Spotify", url: "https://open.spotify.com", tint: "30,215,96" },
    { name: "Prime Video", url: "https://www.primevideo.com", tint: "0,168,225" },
    { name: "Disney+", url: "https://www.disneyplus.com", tint: "40,90,230" }
  ];
  var slots = [{}, {}, {}, {}, {}, {}], scEdit = 0, scTint = "", scKind = "other";

  function loadShortcuts() {
    return api("shortcuts").then(function (r) { slots = r.slots; renderShortcuts(); });
  }

  function renderShortcuts() {
    var list = $("sc-list"); list.innerHTML = "";
    slots.forEach(function (s, i) {
      var filled = !!(s.game || (s.target && s.name));
      var r = el("button", "row"); r.type = "button";
      var ico = el("span", "ico");
      if (!filled) { ico.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>'; }
      else if (s.brand && window.DeskBrands && window.DeskBrands[s.brand]) {
        // A well-known service shows its own icon.
        ico.innerHTML = window.DeskBrands[s.brand];
        ico.firstChild.setAttribute("class", "svc-icon");
        ico.classList.add("has-brand");
      }
      else if (s.icon) { var img = document.createElement("img"); img.src = s.icon; img.alt = ""; ico.appendChild(img); }
      else {
        ico.textContent = s.name.charAt(0).toUpperCase();
        ico.style.fontWeight = "700";
        if (s.tint) ico.style.background = "rgba(" + s.tint + ",.35)";
      }
      r.appendChild(ico);
      var tx = el("span", "txt");
      tx.appendChild(text("b", "", filled ? s.name : t("emptySlot", i + 1)));
      tx.appendChild(text("span", "", !filled ? t("emptySlotHint") : s.game ? t("scGameKind") : s.target));
      r.appendChild(tx);
      var ed = el("span", "icon-btn", ICON_EDIT); r.appendChild(ed);
      r.onclick = function () { openShortcut(i); };
      list.appendChild(r);
    });
  }

  function saveShortcuts(list) {
    var body = { slots: list.map(function (s) { return s.game ? { game: s.game } : { name: s.name || "", target: s.target || "", tint: s.tint || "" }; }) };
    return api("shortcuts", body).then(function (r) { slots = r.slots; renderShortcuts(); toast(t("saved")); });
  }

  function openShortcut(i) {
    scEdit = i;
    var s = slots[i] || {};
    scTint = s.tint || "";
    $("sc-modal-title").textContent = t("scTitle", i + 1);
    $("sc-name").value = s.name || "";
    $("sc-target").value = s.target || "";
    $("sc-error").textContent = "";
    $("sc-clear").hidden = !(s.game || (s.target && s.name));
    var sel = $("sc-game"); sel.innerHTML = "";
    games.forEach(function (g) { var o = document.createElement("option"); o.value = g.id; o.textContent = g.name; sel.appendChild(o); });
    if (s.game) sel.value = s.game;
    setScKind(s.game ? "game" : "other");
    $("sc-modal").hidden = false;
    setTimeout(function () { $("sc-name").focus(); }, 30);
  }

  function setScKind(k) {
    scKind = k;
    Array.prototype.forEach.call($("sc-kind").children, function (b) { b.classList.toggle("on", b.dataset.kind === k); });
    $("sc-game-part").hidden = k !== "game"; $("sc-other-part").hidden = k !== "other";
  }
  Array.prototype.forEach.call($("sc-kind").children, function (b) {
    b.onclick = function () {
      if (b.dataset.kind === "game" && !games.length) { $("sc-error").textContent = t("noGamesYet"); return; }
      $("sc-error").textContent = ""; setScKind(b.dataset.kind);
    };
  });

  (function buildPresets() {
    PRESETS.forEach(function (p) {
      var b = el("button", "chipbtn"); b.type = "button";
      var dot = el("i"); dot.style.background = "rgb(" + p.tint + ")";
      b.appendChild(dot); b.appendChild(document.createTextNode(p.name));
      b.onclick = function () { $("sc-name").value = p.name; $("sc-target").value = p.url; scTint = p.tint; };
      $("sc-presets").appendChild(b);
    });
  })();

  $("sc-browse").onclick = function () {
    api("browse", {}).then(function (r) {
      if (!r.path) return;
      $("sc-target").value = r.path; scTint = "";
      if (!$("sc-name").value.trim()) $("sc-name").value = r.path.split("\\").pop().replace(/\.(exe|lnk|bat|cmd)$/i, "");
    });
  };
  // A program path or anything that is not a web address does not keep a preset's color.
  $("sc-target").oninput = function () { if (!/^(https?:\/\/)?[^\x5c\/]+\./i.test($("sc-target").value)) scTint = ""; };

  $("sc-save").onclick = function () {
    if (scKind === "game") {
      var gid = $("sc-game").value;
      if (!gid) { $("sc-error").textContent = t("noGamesYet"); return; }
      var gl = slots.slice(); gl[scEdit] = { game: gid };
      saveShortcuts(gl).then(function () { $("sc-modal").hidden = true; }).catch(function (e) { $("sc-error").textContent = e.message; });
      return;
    }
    var name = $("sc-name").value.trim(), target = $("sc-target").value.trim();
    if (!name) { $("sc-error").textContent = t("scNeedName"); return; }
    if (!target) { $("sc-error").textContent = t("needAddress"); return; }
    var list = slots.slice(); list[scEdit] = { name: name, target: target, tint: scTint };
    saveShortcuts(list).then(function () { $("sc-modal").hidden = true; }).catch(function (e) { $("sc-error").textContent = e.message; });
  };
  $("sc-clear").onclick = function () {
    var list = slots.slice(); list[scEdit] = {};
    saveShortcuts(list).then(function () { $("sc-modal").hidden = true; }).catch(function (e) { $("sc-error").textContent = e.message; });
  };

  // ---- Polling -----------------------------------------------------------

  // Poll only while the window is visible, so an open dashboard costs nothing in the background.
  var timer = null, usageTimer = null;
  function schedule() {
    clearInterval(timer);
    clearInterval(usageTimer);
    timer = document.hidden ? null : setInterval(refresh, 2000);
    usageTimer = document.hidden ? null : setInterval(pollUsage, 1000);
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { refresh(); pollUsage(); } schedule(); });
  // Deep links: #devices, #games, #pair.
  var start = location.hash.slice(1);
  if (start === "devices" || start === "games" || start === "guide") go(start);
  if (start === "pair") openPair();
  refresh();
  pollUsage();
  schedule();
})();
</script>
</body>
</html>
